<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 3rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 1rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    input[type="text"] { flex: 1; padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { padding: 0.6rem 0.5rem; border-bottom: 1px solid #ddd; }
    .empty { color: #888; }
  </style>
</head>
<body>
  <h1>To-Do List</h1>

  <form action="{{ url_for('add') }}" method="post">
    <input type="text" name="title" placeholder="Add a task..." autofocus>
    <button type="submit">Add</button>
  </form>

  <ul>
    {% for task in tasks %}
      <li>{{ task.title }}</li>
    {% else %}
      <li class="empty">No tasks yet. Add one above.</li>
    {% endfor %}
  </ul>
</body>
</html>
